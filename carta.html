<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eu fiz uma coisa pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#0f0e24; --deep:#181638; --dusk:#2a2650;
  --rose:#f0a9bd; --star:#f6e3b4; --ink:#efeaf7; --muted:#a9a3c8; --alert:#ff6b6b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#201c4c 0%,var(--night) 62%);
  color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  -webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;z-index:0}
#veil{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2s ease;
  background:radial-gradient(circle at 50% 45%,rgba(5,4,15,0) 0,rgba(5,4,15,.92) 100%);
}
body.dim #veil{opacity:.55}
body.calm #veil{opacity:.8}
#siren{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,60,60,0) 45%,rgba(255,60,60,.4) 100%);
}
#siren.go{animation:sir .7s ease-in-out 3}
@keyframes sir{0%,100%{opacity:0}50%{opacity:1}}
#hearts{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:rise linear forwards}
@keyframes rise{
  0%{transform:translate(0,0);opacity:0}
  15%{opacity:.6}
  100%{transform:translate(24px,-115vh);opacity:0}
}
#prog{
  position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:0;z-index:5;
  background:linear-gradient(90deg,var(--rose),var(--star));
  transition:width 1.2s ease,opacity 1s ease;
}
#stage{position:fixed;inset:0;z-index:2}
.scene{
  position:absolute;inset:0;overflow-y:auto;display:flex;
  padding:calc(clamp(28px,6vh,64px) + env(safe-area-inset-top,0px)) 22px calc(clamp(28px,6vh,64px) + env(safe-area-inset-bottom,0px));
  opacity:0;pointer-events:none;transition:opacity .9s ease;
  -webkit-overflow-scrolling:touch;
}
.scene.in{opacity:1;pointer-events:auto}
.col{width:100%;max-width:34rem;margin:auto}
.center{text-align:center}

.rv{opacity:0;transition:opacity 1.3s ease}
.rv.on{opacity:1}
.rv:not(.on){pointer-events:none}

.kick{margin:0 0 .35rem;font-style:italic;font-size:1.15rem;color:var(--rose);font-weight:500}
.ct{margin:0 0 1.6rem;font-weight:600;font-size:clamp(1.9rem,6.4vw,2.7rem);line-height:1.08;color:#fff7e6}
p{margin:0 0 1.15em;font-size:clamp(1.22rem,4.1vw,1.42rem);line-height:1.62;font-weight:500;color:#e9e3f5;text-wrap:pretty}
.hl{font-style:italic;font-size:clamp(1.45rem,5vw,1.8rem);color:var(--star);line-height:1.4}
.actions{margin-top:1.4rem}
.center .actions{display:flex;justify-content:center}

.btn{
  font-family:'Figtree',system-ui,sans-serif;font-weight:600;font-size:.98rem;
  padding:.85rem 1.6rem;border-radius:999px;cursor:pointer;
  color:#ffdbe5;background:rgba(240,169,189,.12);border:1px solid rgba(240,169,189,.55);
  transition:background .25s ease,transform .25s ease;
}
.btn:hover{background:rgba(240,169,189,.24)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--star);outline-offset:3px}
.btn.ghost{background:transparent;border-color:rgba(169,163,200,.4);color:var(--muted);font-weight:400}

.intro-line{
  font-size:clamp(2rem,8.5vw,3.4rem);font-style:italic;font-weight:600;line-height:1.2;
  color:#fff7e6;min-height:2.6em;margin-bottom:1.2rem;
}
.typing::after{
  content:'';display:inline-block;width:2px;height:.95em;margin-left:3px;
  background:currentColor;vertical-align:-.1em;animation:blink .8s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* cartão do fiscal */
.fiscal{
  margin:1.4rem 0 1.6rem;padding:1.1rem 1.2rem;border-radius:10px;
  background:rgba(48,14,28,.62);border:1px solid rgba(255,107,107,.55);
  box-shadow:0 0 30px rgba(255,107,107,.16);
  font-family:'Figtree',system-ui,sans-serif;font-size:.97rem;line-height:1.6;color:#ffe7e7;
}
.fiscal .fh{font-weight:700;color:var(--alert);margin-bottom:.7rem;min-height:1.6em}
.fiscal .fn{font-weight:700;font-size:1.2rem;color:#fff;margin-bottom:.5rem;min-height:1.6em}
.fiscal .fr{margin:.2rem 0;min-height:1.6em}
.fiscal b{font-weight:600;color:#ffb3b3}

/* frase que brilha */
.glow.pulse{animation:glow 2.8s ease-out 1}
@keyframes glow{
  0%{text-shadow:0 0 0 rgba(240,169,189,0)}
  35%{text-shadow:0 0 18px rgba(240,169,189,.95)}
  100%{text-shadow:0 0 0 rgba(240,169,189,0)}
}
.glow{color:#ffd9e4;font-style:italic}
.openline{
  font-size:clamp(1.9rem,7vw,2.9rem);font-style:italic;font-weight:600;line-height:1.2;
  color:var(--star);margin-bottom:1.6rem;min-height:2.4em;
}

/* livro */
.book{
  width:100%;max-width:58rem;margin:auto;display:grid;gap:1.3rem;
  padding:clamp(1.3rem,4vw,2.4rem);
  background:linear-gradient(180deg,#1e1a47,#171439);
  border:1px solid rgba(246,227,180,.22);border-left:6px solid rgba(246,227,180,.42);
  border-radius:6px 16px 16px 6px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.book .lp svg{width:72px;height:auto;display:block;margin-bottom:.9rem}
.book .ct{margin-bottom:.4rem}
.book .rp p:last-child,.book .rp .actions:last-child{margin-bottom:0}
@media(min-width:760px){
  .book{
    grid-template-columns:1fr 1fr;gap:0;padding:0;border-left-width:1px;
    background:linear-gradient(90deg,#1c1943 0%,#221e4d 48%,#0e0c27 50%,#221e4d 52%,#1c1943 100%);
  }
  .book .lp,.book .rp{padding:2.8rem 2.5rem}
  .book .lp{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
}

/* frases grandes */
.big{
  font-size:clamp(2rem,8vw,3.5rem);font-style:italic;font-weight:600;line-height:1.2;
  color:var(--star);text-shadow:0 0 30px rgba(246,227,180,.25);margin:0;
}
.rv.big{transition-duration:2s}
.q{font-size:clamp(1.5rem,5.6vw,2.2rem);font-style:italic;line-height:1.38;margin:0 0 .7rem;color:var(--ink)}
.q.qb{font-size:clamp(1.8rem,6.6vw,2.6rem);font-weight:600;color:var(--star)}
.q.rv{transition-duration:2s}

/* P.S. */
.pst{font-style:italic;color:var(--rose);font-size:1.4rem;margin-bottom:.4rem}
.sig{font-size:1.25rem;color:var(--muted);margin-top:1.4rem}
.sig b{color:var(--ink);font-weight:600}

@media (prefers-reduced-motion:reduce){
  .rv,.scene{transition-duration:.01s}
  .heart,#siren.go,.glow.pulse,.typing::after{animation:none}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div id="siren" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<div id="prog" aria-hidden="true"></div>
<main id="stage" aria-live="polite"></main>
<noscript><p style="position:relative;z-index:3;padding:2rem">Essa carta precisa de JavaScript ativado para abrir.</p></noscript>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const stage=$('#stage'),heartsLayer=$('#hearts'),siren=$('#siren'),progEl=$('#prog');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- estrelas ---------- */
  const cv=$('#stars'),cx=cv.getContext('2d');
  let W=0,H=0,stars=[];
  function sizeStars(){
    if(W===innerWidth && Math.abs(H-innerHeight)<140) return;
    const d=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';
    cx.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(W*H/9000)},()=>({
      x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.25,
      p:Math.random()*6.28,s:.3+Math.random()*.9
    }));
  }
  function drawStars(t){
    cx.clearRect(0,0,W,H);
    cx.fillStyle='#f6e3b4';
    for(const s of stars){
      cx.globalAlpha=.22+.42*(.5+.5*Math.sin(t/1000*s.s+s.p));
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();
    }
    if(!reduce) requestAnimationFrame(drawStars);
  }
  sizeStars();requestAnimationFrame(drawStars);
  addEventListener('resize',()=>{sizeStars();if(reduce)requestAnimationFrame(drawStars)});

  /* ---------- utilitários ---------- */
  let fast=false,canSkip=false,pending=[],scene=null;
  const tick=ms=>new Promise(r=>setTimeout(r,ms));
  function wait(ms){
    return new Promise(res=>{
      if(fast&&canSkip) return setTimeout(res,25);
      const t=setTimeout(fin,ms);
      function fin(){clearTimeout(t);pending=pending.filter(f=>f!==fin);res();}
      pending.push(fin);
    });
  }
  stage.addEventListener('click',e=>{
    if(!canSkip||e.target.closest('button')) return;
    fast=true;pending.slice().forEach(f=>f());
  });
  function prog(x){progEl.style.width=(x*100)+'%'}

  function mount(html,opt={}){
    const old=scene;
    fast=false;canSkip=!!opt.skip;pending=[];
    const el=document.createElement('section');
    el.className='scene';el.innerHTML=html;
    stage.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
    if(old){old.classList.remove('in');setTimeout(()=>old.remove(),1000);}
    scene=el;return el;
  }
  async function type(el,text,speed=34){
    el.classList.add('typing');
    const chars=Array.from(text);
    for(let i=0;i<chars.length;i++){
      if(fast&&canSkip){el.textContent=text;break;}
      el.textContent+=chars[i];
      await tick(speed);
    }
    el.classList.remove('typing');
  }
  function burst(n=8){
    if(reduce) return;
    for(let i=0;i<n;i++){
      const h=document.createElement('span');
      h.className='heart';
      h.textContent=Math.random()<.5?'♡':'♥';
      h.style.left=(8+Math.random()*84)+'vw';
      h.style.fontSize=(14+Math.random()*22)+'px';
      h.style.animationDuration=(5+Math.random()*4)+'s';
      h.style.animationDelay=(Math.random()*1.4)+'s';
      heartsLayer.appendChild(h);
      setTimeout(()=>h.remove(),11500);
    }
  }
  function sirenGo(){
    if(reduce) return;
    siren.classList.remove('go');void siren.offsetWidth;siren.classList.add('go');
  }
  const clickBtn=el=>new Promise(r=>el.querySelector('button').addEventListener('click',r,{once:true}));

  async function play(el,hooks={}){
    hooks.none=()=>wait(0);
    const items=[...el.querySelectorAll('.rv')];
    await wait(900);
    for(const it of items){
      it.classList.add('on');
      it.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
      const h=it.dataset.hook;
      if(h&&hooks[h]) await hooks[h](it);
      else await wait(Math.min(3000,1000+it.textContent.length*16));
    }
  }

  /* ---------- peças de HTML ---------- */
  const P=(t,cls='',hook='')=>`<p class="rv ${cls}"${hook?` data-hook="${hook}"`:''}>${t}</p>`;
  const B=label=>`<div class="actions rv" data-hook="none"><button class="btn" type="button">${label}</button></div>`;
  const chap=(k,title,body)=>`<div class="col"><p class="kick">${k}</p><h2 class="ct">${title}</h2>${body}</div>`;
  const BOOK=`<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M32 8C24 3 12 3 4 6v34c8-3 20-3 28 2 8-5 20-5 28-2V6c-8-3-20-3-28 2z" fill="none" stroke="#f6e3b4" stroke-width="2" stroke-linejoin="round"/><path d="M32 8v34" stroke="#f6e3b4" stroke-width="2"/></svg>`;
  const book=(k,title,body)=>`<div class="book"><div class="lp">${BOOK}<p class="kick">${k}</p><h2 class="ct">${title}</h2></div><div class="rp">${body}</div></div>`;

  /* ---------- cenas ---------- */
  async function intro(){
    document.body.classList.remove('dim','calm');
    prog(0);progEl.style.opacity=1;
    const el=mount(`<div class="col center"><p class="intro-line" id="t"></p><div class="actions rv" id="go"><button class="btn" type="button">abrir minha carta ♡</button></div></div>`);
    await wait(1100);
    await type($('#t'),'Eu fiz uma coisa pra você…',58);
    await wait(900);
    $('#go').classList.add('on');
    await clickBtn(el);
    burst(10);
  }

  async function ch1(){
    prog(.1);
    const el=mount(chap('Capítulo I','Como você apareceu do nada',
      P('Eu sei que a gente se conhece há pouco tempo, mas é engraçado pensar que, em tão pouco tempo, você já conseguiu se tornar alguém tão importante pra mim.')+
      P('Gosto muito da forma como as coisas estão acontecendo entre a gente. Das nossas conversas, das nossas brincadeiras, das besteiras que a gente fala e até daqueles momentos em que um fica implicando com o outro. Acho que são essas pequenas coisas que fazem tudo ficar tão gostoso e tão nosso.')+
      B('continuar →')),{skip:true});
    await play(el);await clickBtn(el);
  }

  async function ch2(){
    prog(.26);
    const el=mount(chap('Capítulo II','O cargo de fiscal',
      P('E eu sei que sou bem chato às vezes, principalmente quando começo com meu famoso “vai descansar” KKKKKK.')+
      P('Você já me apelidou de fiscal e, sinceramente, acho que esse cargo já foi oficialmente registrado.')+
      `<div class="fiscal rv" data-hook="fiscal">
         <div class="fh" data-t="🚨 SISTEMA DE FISCALIZAÇÃO ATIVADO 🚨"></div>
         <div class="fn" data-t="Fiscal Gago™"></div>
         <div class="fr"><b>Função:</b> <span data-t="garantir que determinada branca azeda descanse adequadamente."></span></div>
         <div class="fr"><b>Status:</b> <span data-t="Ativo 24/7"></span></div>
         <div class="fr"><b>Motivo:</b> <span data-t="preocupação excessiva. KKKKKK"></span></div>
       </div>`+
      P('Mas fazer o quê? Eu me preocupo com você e com essa cabecinha aí. Se eu puder evitar você se acabando de cansaço, vou continuar fiscalizando mesmo.')+
      B('entendi, fiscal →')),{skip:true});
    await play(el,{fiscal:async card=>{
      sirenGo();
      await wait(900);
      for(const n of card.querySelectorAll('[data-t]')){
        await type(n,n.dataset.t,22);
        await wait(260);
      }
      await wait(900);
    }});
    await clickBtn(el);
  }

  async function ch3(){
    prog(.42);
    document.body.classList.add('dim');
    const el=mount(`<div class="col"><p class="kick">Capítulo III</p><h2 class="ct">Um gaguinho a seu dispor</h2>
      <p class="openline" id="open"></p>
      ${P('Eu sei que você já está acostumada com isso, mas agora apareceu <span class="glow">um gaguinho pra te ajudar no que for preciso.</span>','','glow')}
      ${P('Não precisa deixar de ser independente nem mudar seu jeito, só quero que você saiba que agora tem alguém aqui pra dividir um pouco do peso com você.')}
      ${B('continuar →')}</div>`,{skip:true});
    await wait(1000);
    await type($('#open'),'Você não precisa fazer tudo sozinha.',44);
    await wait(1200);
    await play(el,{glow:async p=>{
      p.querySelector('.glow').classList.add('pulse');
      burst(9);
      await wait(3600);
    }});
    await clickBtn(el);
  }

  async function ch4(){
    prog(.55);
    document.body.classList.remove('dim');
    let el=mount(book('Capítulo IV','O príncipe que claramente não era um príncipe',
      P('Eu também sei que você lê um monte de livros de romance e provavelmente já viu príncipe de todo tipo nessas histórias. E eu sei que eu não sou nenhum príncipe KKKKKK. Muito pelo contrário, você provavelmente ainda deve achar que eu não presto.')+
      B('continuar →')),{skip:true});
    await play(el);await clickBtn(el);

    prog(.63);
    el=mount(`<div class="col center"><p class="big rv">Mas isso não quer dizer que eu não possa te tratar como uma princesa.</p></div>`);
    await wait(1100);
    el.querySelector('.big').classList.add('on');
    burst(7);
    await wait(5200);

    prog(.7);
    el=mount(book('Capítulo IV','O príncipe que claramente não era um príncipe',
      P('Talvez eu não tenha cavalo branco, reino ou aquelas frases perfeitas de livro…')+
      P('mas acho que posso tentar fazer você se sentir especial do meu jeito.','hl')+
      P('Com minhas brincadeiras, minhas implicâncias, meu “vai descansar”, minhas mensagens aleatórias e esse meu jeito meio torto de demonstrar carinho.')+
      B('continuar →')),{skip:true});
    await play(el);await clickBtn(el);
  }

  async function ch5(){
    prog(.8);
    const el=mount(chap('Capítulo V','Sem pressa',
      P('Eu não quero colocar pressão em nada e nem ficar tentando descobrir agora onde tudo isso vai dar. Quero só continuar vivendo esses momentos, conhecendo você cada vez mais e deixando as coisas acontecerem naturalmente.')+
      B('continuar →')),{skip:true});
    await play(el);await clickBtn(el);
  }

  async function lines(arr,{gap=1700,hold=3500,big=false}={}){
    const el=mount(`<div class="col center">${arr.map(t=>`<p class="q rv${big?' qb':''}">${t}</p>`).join('')}</div>`);
    await wait(1100);
    for(const p of el.querySelectorAll('.q')){p.classList.add('on');await wait(gap);}
    await wait(hold);
  }

  async function quiet(){
    document.body.classList.add('calm');
    prog(.9);
    await lines(['Se depender de mim,','eu quero aproveitar cada capítulo sem pressa,','sem fingir que não sinto','e sem deixar passar algo que pode ser especial.'],{gap:1900,hold:4500});
    await lines(['Porque algumas histórias não começam quando a gente procura por elas.','Elas simplesmente acontecem.'],{gap:2400,hold:4200});
    await lines(['No fim, eu acho que é isso que mais gosto em tudo que está acontecendo.','Eu não estava procurando por nada disso, mas do nada aparece…'],{gap:2400,hold:2600});

    mount('');
    await wait(2200);
    document.body.classList.remove('calm');
    const el=mount(`<div class="col center">
      <p class="q rv" id="e1">Enfim...</p>
      <p class="q qb rv" id="e2">uma branca azeda que se acha marrenta.</p>
      <p class="q rv" id="e3">Como alguém consegue ser tão insuportável e tão especial ao mesmo tempo? ❤️</p>
      <div class="actions rv" id="e4"><button class="btn" type="button">fechar carta</button></div></div>`);
    await wait(900);$('#e1').classList.add('on');
    await wait(1500);$('#e2').classList.add('on');
    await wait(3400);$('#e3').classList.add('on');burst(10);
    await wait(2800);$('#e4').classList.add('on');
    await clickBtn(el);
  }

  async function ending(){
    prog(1);
    mount(`<div class="col center"><p class="big" id="c"></p></div>`);
    await wait(1000);
    await type($('#c'),'Calma, ainda não acabou.',52);
    await wait(2000);
    const el=mount(`<div class="col center">
      <p class="pst rv" id="p1">P.S.:</p>
      <p class="big rv" id="p2">Você ainda precisa descansar.</p>
      <p class="sig rv" id="p3">— Atenciosamente,<br><b>seu fiscal favorito 🚨</b></p>
      <div class="actions rv" id="p4"><button class="btn ghost" type="button">ler de novo ♡</button></div></div>`);
    await wait(1000);$('#p1').classList.add('on');
    await wait(1500);$('#p2').classList.add('on');burst(8);
    await wait(3200);$('#p3').classList.add('on');
    await wait(4500);$('#p4').classList.add('on');
    await clickBtn(el);
  }

  async function main(){
    for(;;){
      await intro();await ch1();await ch2();await ch3();await ch4();await ch5();await quiet();await ending();
    }
  }
  main();
})();
</script>
</body>
</html>
